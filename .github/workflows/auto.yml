name: Auto Update Version PWA

on:
  push:
    branches:
      - main

jobs:
  update-version:
    # Bo qua khong chay neu robot tu commit de tranh lap vo han
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Tao version ngau nhien va ghi vao file
        run: |
          TIMESTAMP=$(date +%s)
          NEW_VERSION="v$TIMESTAMP"
          
          # 1. Ghi de file version.json
          echo "{\"version\": \"$NEW_VERSION\"}" > version.json
          
          # 2. Tu dong tim va thay the ten Cache trong sw.js
          sed -i "s/const CACHE_NAME = '.*';/const CACHE_NAME = 'thanh-nguyen-vf5-$NEW_VERSION';/g" sw.js

      - name: Robot tu dong Commit va Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json sw.js
          git commit -m "Auto-bump version to $NEW_VERSION [skip ci]" || echo "Khong co gi thay doi"
          git push
