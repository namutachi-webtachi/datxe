<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Thanh Nguyen - Dich Vu Xe Rieng Chuyen Nghiep</title>

  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0b1420">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="./assets/logo.png">

  <style>
    html, body { width: 100%; height: 100%; margin: 0; background-color: #060e18; }
  </style>

  <script>
    const APP_VERSION = '1.0.1'; // Mỗi lần update tính năng, ông sửa số này thành 1.0.2, 1.0.3...

    // 1. DĂNG KÝ VÀ BẮT SỰ KIỆN UPDATE TỪ SERVICE WORKER
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then((reg) => {
          // Bắt sự kiện: Cứ hễ có file sw.js mới trên GitHub là kích hoạt ngay
          reg.onupdatefound = () => {
            const installingWorker = reg.installing;
            installingWorker.onstatechange = () => {
              if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                // Có bản update mới -> Ép trình duyệt tự động F5 ngay lập tức
                console.log('Phat hien ban cap nhat, tu dong reload!');
                window.location.reload();
              }
            };
          };
        });
      });

      // Lắng nghe sự kiện Service Worker chiếm quyền điều khiển
      let refreshing;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (refreshing) return;
        refreshing = true;
        window.location.reload();
      });
    }

    // 2. LOGIC RẼ NHÁNH VÀ CHỐNG KẸT CACHE URL
    const VERSION_KEY = 'tn_version';
    const CACHE_KEY = 'thanh_nguyen_intro_seen';
    
    const savedVersion = localStorage.getItem(VERSION_KEY);
    const urlParams = new URLSearchParams(window.location.search);

    // Kích hoạt khi có version mới HOẶC bị ép reset
    if (savedVersion !== APP_VERSION || urlParams.get('reset') === '1') {
      localStorage.clear();
      localStorage.setItem(VERSION_KEY, APP_VERSION);
      window.location.replace('./intro.html?v=' + APP_VERSION);
    } 
    // Nếu khách quen
    else if (localStorage.getItem(CACHE_KEY) === 'true') {
      window.location.replace('./booking.html?v=' + APP_VERSION);
    } 
    // Nếu khách lạ
    else {
      window.location.replace('./intro.html?v=' + APP_VERSION);
    }
  </script>
</head>
<body></body>
</html>
