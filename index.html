<script>
  const APP_VERSION = '1.0.2';
  const VERSION_KEY = 'thanh_nguyen_app_version';

  // 1. DANG KY SERVICE WORKER
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').then((reg) => {
        
        // Lang nghe khi co ban cap nhat moi tai ve xong
        reg.onupdatefound = () => {
          const installingWorker = reg.installing;
          installingWorker.onstatechange = () => {
            if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
              console.log('Phat hien code moi tu GitHub. Dang update...');
              window.location.reload();
            }
          };
        };
      });
    });
  }

  // 2. THUAT TOAN "TINH GIAC": EP KIEM TRA CAP NHAT MOI KHI KHACH MO LAI APP
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      // Khi app duoc mo len tu che do nen
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.ready.then((reg) => {
          // Lenh update() nay ep trinh duyet phai hoi server xem co file sw.js moi khong
          // No bo qua cache giong nhu y tuong "so ngau nhien" cua Chu tich
          reg.update();
        });
      }
    }
  });

  // 3. LOGIC RE NHANH DIEU HUONG
  const savedVersion = localStorage.getItem(VERSION_KEY);
  const CACHE_KEY = 'thanh_nguyen_intro_seen';
  
  if (savedVersion !== APP_VERSION) {
    // Co phien ban moi -> Ghi nhan version moi va vao Intro
    localStorage.setItem(VERSION_KEY, APP_VERSION);
    window.location.replace('./intro.html?v=' + APP_VERSION);
  } 
  else if (localStorage.getItem(CACHE_KEY) === 'true') {
    window.location.replace('./booking.html?v=' + APP_VERSION);
  } 
  else {
    window.location.replace('./intro.html?v=' + APP_VERSION);
  }
</script>
