<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <!-- BUA CHONG CACHE HTTP CUA TRINH DUYET DIEN THOAI -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>Thanh Nguyen - Dich Vu Xe Rieng Chuyen Nghiep</title>

  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0b1420">
  <meta name="mobile-web-app-capable" content="yes">
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Thanh Nguyen">
  <link rel="apple-touch-icon" href="./assets/logo.png">

  <style>
    html, body { width: 100%; height: 100%; margin: 0; padding: 0; background-color: #060e18; overflow: hidden; }
  </style>

  <script>
    const APP_VERSION = '1.0.3';
    const VERSION_KEY = 'thanh_nguyen_app_version';
    const CACHE_KEY = 'thanh_nguyen_intro_seen';

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then((reg) => {
          reg.onupdatefound = () => {
            const installingWorker = reg.installing;
            installingWorker.onstatechange = () => {
              if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                console.log('[Index] Phat hien ban cap nhat moi tu GitHub!');
                window.location.reload();
              }
            };
          };
          
          document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') reg.update();
          });
        }).catch(() => {});
      });
    }

    const savedVersion = localStorage.getItem(VERSION_KEY);
    const urlParams = new URLSearchParams(window.location.search);

    if (savedVersion !== APP_VERSION || urlParams.get('reset') === '1') {
      localStorage.clear();
      localStorage.setItem(VERSION_KEY, APP_VERSION);
      window.history.replaceState({}, document.title, window.location.pathname);
      window.location.replace('./intro.html');
    } 
    else if (localStorage.getItem(CACHE_KEY) === 'true') {
      window.location.replace('./booking.html');
    } 
    else {
      window.location.replace('./intro.html');
    }
  </script>
</head>
<body></body>
</html>
