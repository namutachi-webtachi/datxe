<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Taxi TN - Dich Vu Xe Rieng</title>
  
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0b1420">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Taxi TN">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="./assets/logo.png">

  <style>
    html, body { width: 100%; height: 100%; margin: 0; background-color: #060e18; overflow: hidden; }
  </style>

  <script>
   
      // 1. DANG KY SERVICE WORKER
      if ('serviceWorker' in navigator) {
        try {
          await navigator.serviceWorker.register('./sw.js');
        } catch (e) {}
      }

      // 2. SO SANH PHIEN BAN QUA NGON HAI DANG version.json (BO QUA 100% CACHE)
      try {
        const res = await fetch('./version.json?t=' + Date.now(), { cache: 'no-store' });
        const data = await res.json();
        const serverVersion = data.version;
        const localVersion = localStorage.getItem('thanh_nguyen_app_version');

        if (localVersion && localVersion !== serverVersion) {
          // Co ban moi -> Xoa sach Cache cu cua PWA
          if ('caches' in window) {
            const keys = await caches.keys();
            await Promise.all(keys.map(k => caches.delete(k)));
          }
        }
        localStorage.setItem('thanh_nguyen_app_version', serverVersion);
      } catch (err) {}

      // 3. DIEU HUONG CHUAN XAC
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('reset') === '1') {
        localStorage.clear();
        window.history.replaceState({}, document.title, window.location.pathname);
        window.location.replace('./intro.html');
      } else if (localStorage.getItem('thanh_nguyen_intro_seen') === 'true') {
        window.location.replace('./booking.html');
      } else {
        window.location.replace('./intro.html');
      }
    }

    initGateway();
  </script>
</head>
<body></body>
</html>
