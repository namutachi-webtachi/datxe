<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Taxi TN - Dich Vu Xe Rieng</title>
  
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0b1420">
  
  <link rel="stylesheet" href="./css/booking.css?v=1.0.4">
</head>
<body>

  <div class="app-shell">
    
    <!-- HEADER MODULE -->
    <header class="top-nav">
      <!-- LOGO: Nhan 5 lan de xoa cache -->
      <img src="./assets/logo.png" alt="TN" class="nav-logo" id="secretLogo">

      <!-- NUT TAI APP SANG TRONG -->
      <div class="nav-install-btn" id="pwaInstallBtn">
        <img src="./assets/download.png" alt="Tai App" class="install-icon-img" id="installIcon">
        <span class="install-text">TẢI APP</span>
      </div>
    </header>

    <!-- MAIN CONTENT MODULE -->
    <main class="main-content">
      <h3 style="color: #dfb76c; font-size: 16px; text-transform: uppercase; letter-spacing: 1px;">
        Khu vuc Main Booking
      </h3>
      <p style="color: #64748b; font-size: 12px; margin-top: 10px;">
        San sang tich hop Module Ban do va Tinh gia...
      </p>
    </main>

  </div>

  <!-- KHOI DONG CAC SCRIPT MODULE -->
  <script type="module">
    import { initHeaderEvents } from './js/core-events.js';
    import { autoCropImage } from './js/autocrop.js';
    import { initSystemMonitor } from './js/system-monitor.js';
    import { initAppUpdater } from './js/app-updater.js';

    window.addEventListener('DOMContentLoaded', async () => {
      // 1. Kich hoat su kien click ngay lap tuc de nut luon luon nhan lenh
      initHeaderEvents();
      initSystemMonitor();
      initAppUpdater();

      // 2. Vi phau got vien anh chay phu o phia sau
      const installIcon = document.getElementById('installIcon');
      if (installIcon) {
        try {
          await autoCropImage(installIcon);
        } catch (e) {}
      }
    });
  </script>
</body>
</html>
