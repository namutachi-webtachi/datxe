<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Taxi TN - Đặt Xe Trực Tuyến</title>

  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0b1420">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="./assets/logo.png">

  <!-- LEAFLET BAN DO CDN -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="./css/booking.css?v=1.0.8">
</head>
<body>

  <div class="app-shell">
    
    <!-- HEADER -->
    <header class="top-nav">
      <img src="./assets/logo.png" alt="TN" class="nav-logo" id="secretLogo" title="Chạm 5 lần để làm mới hệ thống">
      <button type="button" class="nav-install-btn" id="pwaInstallBtn">
        <img src="./assets/download.png" alt="Tải App" class="install-icon-img" id="installIcon">
        <span class="install-text" id="installText">TẢI APP</span>
      </button>
    </header>

    <!-- MAIN CONTENT -->
    <main class="booking-content-area">
      
      <!-- TRANG THAI BAC TAI -->
      <div class="driver-status-bar">
        <div class="status-indicator-dot"></div>
        <span class="status-indicator-text">XE NHÀ ĐÃ SẴN SÀNG PHỤC VỤ</span>
      </div>

      <!-- BAN DO -->
      <section class="map-wrapper">
        <div id="map"></div>
        <button type="button" class="btn-gps-locate" id="btnGps">
          <svg class="gps-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
          </svg>
          VỊ TRÍ CỦA TÔI
        </button>
      </section>

      <!-- FORM NHAP TU DO -->
      <form id="bookingForm" class="booking-fields-form">
        
        <!-- DIEM DON -->
        <div class="field-group">
          <label for="pickupAddress">ĐIỂM ĐÓN</label>
          <input type="text" id="pickupAddress" autocomplete="off" required placeholder="Nhập địa chỉ đón (Ví dụ: Vườn Cau Vị Khê...)">
        </div>

        <!-- DIEM DEN -->
        <div class="field-group">
          <label for="dropoffAddress">ĐIỂM ĐẾN</label>
          <input type="text" id="dropoffAddress" autocomplete="off" required placeholder="Nhập điểm đến (Ví dụ: Ngõ Trại Cá, Bệnh viện...)">
        </div>

        <!-- LOAI CHUYEN -->
        <div class="trip-options-row">
          <label class="radio-chip">
            <input type="radio" name="tripType" value="oneway" checked>
            <span>MỘT CHIỀU</span>
          </label>
          <label class="radio-chip">
            <input type="radio" name="tripType" value="roundtrip">
            <span>KHỨ HỒI</span>
          </label>
        </div>

        <!-- THONG SO LO TRINH -->
        <div class="route-metrics-card">
          <div class="metric-item">
            <span class="metric-label">Quãng đường tối ưu:</span>
            <strong class="metric-val" id="displayDistance">-- km</strong>
          </div>
          <div class="metric-item">
            <span class="metric-label">Thời gian dự kiến:</span>
            <strong class="metric-val" id="displayDuration">-- phút</strong>
          </div>
          <div class="metric-hint">
            Bác tài sẽ liên hệ trực tiếp để xác nhận giờ đón và báo giá cước hợp lý nhất.
          </div>
        </div>

        <!-- THONG TIN KHACH -->
        <div class="field-group">
          <label for="customerName">HỌ VÀ TÊN</label>
          <input type="text" id="customerName" required placeholder="Nhập tên của bạn">
        </div>

        <div class="field-group">
          <label for="phoneNumber">SỐ ĐIỆN THOẠI</label>
          <input type="tel" id="phoneNumber" required placeholder="09xxxxxxxx (10 số)">
        </div>

        <div class="field-group">
          <label for="notes">GHI CHÚ THÊM (NẾU CÓ)</label>
          <input type="text" id="notes" placeholder="Ví dụ: Có 2 vali to, cần đón đúng giờ...">
        </div>

        <button type="submit" class="btn-submit-booking" id="btnSubmit">
          GỬI YÊU CẦU ĐẶT XE
        </button>

        <div class="contact-actions-row">
          <a href="#" id="btnZaloDirect" class="btn-action-zalo" target="_blank">
            ĐẶT QUA ZALO
          </a>
          <a href="tel:0912101580" class="btn-action-hotline">
            HOTLINE: 0912.101.580
          </a>
        </div>

      </form>
    </main>

    <!-- THANH PING DONG DINH -->
    <div class="system-monitor-bar" id="systemMonitor">
      <div class="monitor-dot" id="pingDot"></div>
      <span class="monitor-text" id="pingText">ĐO PING...</span>
    </div>

  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script type="module">
    // SAFE MODULE IMPORTS
    let autoCropImage, initAppUpdater, initAddressAutocomplete;
    try {
      const cropModule = await import('./js/autocrop.js');
      autoCropImage = cropModule.autoCropImage;
    } catch (e) {}

    try {
      const updaterModule = await import('./js/app-updater.js');
      initAppUpdater = updaterModule.initAppUpdater;
      if (initAppUpdater) initAppUpdater();
    } catch (e) {}

    try {
      const geoModule = await import('./js/geo-search.js');
      initAddressAutocomplete = geoModule.initAddressAutocomplete;
    } catch (e) {}

    // 1. VI PHAU ANH ICON
    const installIcon = document.getElementById('installIcon');
    if (installIcon && autoCropImage) {
      try { autoCropImage(installIcon); } catch (e) {}
    }

    // 2. NUT TAI APP
    const installBtn = document.getElementById('pwaInstallBtn');
    let deferredPrompt = null;
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
    if (isStandalone && installBtn) installBtn.style.display = 'none';

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
    });

    if (installBtn) {
      installBtn.addEventListener('click', (e) => {
        e.preventDefault();
        if (navigator.vibrate) navigator.vibrate(30);

        if (deferredPrompt) {
          deferredPrompt.prompt();
          deferredPrompt.userChoice.then((choice) => {
            if (choice.outcome === 'accepted') installBtn.style.display = 'none';
            deferredPrompt = null;
          }).catch(() => {
            window.location.href = './guide.html';
          });
        } else {
          window.location.href = './guide.html';
        }
      });
    }

    // 3. LOGO SECRET CLEAR CACHE
    const logoBtn = document.getElementById('secretLogo');
    if (logoBtn) {
      let tapCount = 0;
      let tapTimer = null;
      logoBtn.addEventListener('click', () => {
        tapCount++;
        clearTimeout(tapTimer);
        tapTimer = setTimeout(() => { tapCount = 0; }, 1500);

        if (tapCount >= 5) {
          if (navigator.vibrate) navigator.vibrate([80, 50, 80]);
          localStorage.clear();
          sessionStorage.clear();
          if ('caches' in window) {
            caches.keys().then((names) => {
              names.forEach((name) => caches.delete(name));
            });
          }
          alert('HỆ THỐNG: Đã làm mới sạch sẽ bộ nhớ cache!');
          window.location.replace('./index.html?reset=1');
        }
      });
    }

    // ==========================================================================
    // 4. BAN DO BAN QUYEN OPENSTREETMAP NATIVE DARK (0% API KEY, 100% FREE & DETAIL)
    // ==========================================================================
    const DEFAULT_COORDS = { lat: 20.4288, lon: 106.1685 }; // Nam Dinh
    let pickupCoords = { ...DEFAULT_COORDS };
    let dropoffCoords = { lat: 20.9997, lon: 105.8413 }; // Bach Mai
    let userGpsCoords = null;
    
    let routePolyline = null;
    let userLocationMarker = null;
    let measuredDistanceKm = 0;

    // KHOA GIOI HAN BAN DO TRONG PHAM VI VIET NAM
    const VN_BOUNDS = L.latLngBounds(
      L.latLng(8.179, 102.144),
      L.latLng(23.393, 109.464)
    );

    const map = L.map('map', { 
      zoomControl: false,
      scrollWheelZoom: false,
      bounceAtZoomLimits: false,
      maxBounds: VN_BOUNDS,
      maxBoundsViscosity: 1.0,
      minZoom: 5,
      maxZoom: 19,
      tap: true,
      renderer: L.canvas()
    }).setView([DEFAULT_COORDS.lat, DEFAULT_COORDS.lon], 11);
    
    // TIEN TAY WATERMARK: OPENSTREETMAP GLOBAL TILE SERVER VOI CSS DARK-FILTER
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      className: 'dark-tile-layer',
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // FIX CO DAN KHI WEBPAGE LOAD TREN DIEN THOAI
    setTimeout(() => { map.invalidateSize(); }, 300);
    window.addEventListener('load', () => map.invalidateSize());

    // GHIM DIEM DON VA DIEM DEN
    let pickupMarker = L.marker([DEFAULT_COORDS.lat, DEFAULT_COORDS.lon], { draggable: true }).addTo(map);
    let dropoffMarker = L.marker([dropoffCoords.lat, dropoffCoords.lon], { draggable: true }).addTo(map);

    // HAM TU DONG THU PHONG MANG LACE DE HIEN THI HET DIEM & DUONG DI
    function autoFitRouteBounds() {
      const activePoints = [pickupMarker, dropoffMarker];
      if (userLocationMarker) activePoints.push(userLocationMarker);
      
      const featureGroup = L.featureGroup(activePoints);
      
      if (routePolyline) {
        map.fitBounds(routePolyline.getBounds(), { padding: [40, 40], maxZoom: 16 });
      } else {
        map.fitBounds(featureGroup.getBounds(), { padding: [40, 40], maxZoom: 15 });
      }
    }

    // DRAG EVENTS
    pickupMarker.on('dragend', (e) => {
      const pos = e.target.getLatLng();
      pickupCoords = { lat: pos.lat, lon: pos.lng };
      document.getElementById('pickupAddress').value = 'Tọa độ đã ghim trên bản đồ';
      calculateDistance();
    });

    dropoffMarker.on('dragend', (e) => {
      const pos = e.target.getLatLng();
      dropoffCoords = { lat: pos.lat, lon: pos.lng };
      document.getElementById('dropoffAddress').value = 'Tọa độ đã ghim trên bản đồ';
      calculateDistance();
    });

    // HAM TINH ROUTE VOI OSRM
    async function calculateDistance() {
      const url = `https://router.project-osrm.org/route/v1/driving/${pickupCoords.lon},${pickupCoords.lat};${dropoffCoords.lon},${dropoffCoords.lat}?overview=full&geometries=geojson`;
      
      try {
        const res = await fetch(url);
        const data = await res.json();
        
        if (data.routes && data.routes.length > 0) {
          const route = data.routes[0];
          measuredDistanceKm = Math.round((route.distance / 1000) * 10) / 10;
          const durationMins = Math.round(route.duration / 60);

          document.getElementById('displayDistance').innerText = `${measuredDistanceKm} km`;
          document.getElementById('displayDuration').innerText = `${durationMins} phút`;

          if (routePolyline) map.removeLayer(routePolyline);
          
          routePolyline = L.geoJSON(route.geometry, {
            renderer: L.canvas(),
            style: { color: '#dfb76c', weight: 5, opacity: 0.95 }
          }).addTo(map);

          // TU DONG THU PHONG DE XEM HET CON DUONG DI
          autoFitRouteBounds();

          const pAddr = document.getElementById('pickupAddress').value;
          const dAddr = document.getElementById('dropoffAddress').value;
          const zaloMsg = encodeURIComponent(`Chào bác tài, tôi muốn đặt xe từ ${pAddr} đến ${dAddr} (${measuredDistanceKm}km).`);
          document.getElementById('btnZaloDirect').href = `https://zalo.me/0912101580?text=${zaloMsg}`;
        }
      } catch (err) {
        document.getElementById('displayDistance').innerText = '-- km';
        document.getElementById('displayDuration').innerText = '-- phút';
      }
    }

    // AUTOCOMPLETE INTEGRATION
    if (initAddressAutocomplete) {
      initAddressAutocomplete('pickupAddress', (selected) => {
        pickupCoords = { lat: selected.lat, lon: selected.lon };
        pickupMarker.setLatLng([selected.lat, selected.lon]);
        calculateDistance();
      });

      initAddressAutocomplete('dropoffAddress', (selected) => {
        dropoffCoords = { lat: selected.lat, lon: selected.lon };
        dropoffMarker.setLatLng([selected.lat, selected.lon]);
        calculateDistance();
      });
    }

    // TAO ICON PULSE RED/BLUE DANH DAU VI TRI HIEN TAI CUA TOI
    const userGpsIcon = L.divIcon({
      className: 'custom-gps-pin',
      html: `<div class="user-gps-pulse-marker" title="Vị trí của bạn"></div>`,
      iconSize: [18, 18],
      iconAnchor: [9, 9]
    });

    // NUT "VI TRI CUA TOI" DRIVEN WITH AUTO FIT BOUNDS
    document.getElementById('btnGps').addEventListener('click', () => {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition((pos) => {
          const lat = pos.coords.latitude;
          const lon = pos.coords.longitude;
          userGpsCoords = { lat, lon };

          // 1. Cap nhat ghim GPS rieng biet
          if (userLocationMarker) {
            userLocationMarker.setLatLng([lat, lon]);
          } else {
            userLocationMarker = L.marker([lat, lon], { icon: userGpsIcon }).addTo(map);
          }

          // 2. Lay diem don la vi tri nay
          pickupCoords = { lat, lon };
          pickupMarker.setLatLng([lat, lon]);
          document.getElementById('pickupAddress').value = 'Vị trí hiện tại của bạn';

          // 3. Tinh duong & Tu dong co dan full lo trình
          calculateDistance();

        }, () => {
          alert('Không thể truy cập vị trí GPS. Vui lòng bật định vị trên thiết bị!');
        }, { enableHighAccuracy: true });
      }
    });

    // DOC DU LIEU BAN DAU
    document.getElementById('customerName').value = localStorage.getItem('customerName') || '';
    document.getElementById('phoneNumber').value = localStorage.getItem('phoneNumber') || '';
    document.getElementById('pickupAddress').value = 'Vườn Cau Vị Khê, Nam Định';

    // SUBMIT FORM
    document.getElementById('bookingForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('customerName').value.trim();
      const phone = document.getElementById('phoneNumber').value.trim();

      localStorage.setItem('customerName', name);
      localStorage.setItem('phoneNumber', phone);

      const btn = document.getElementById('btnSubmit');
      btn.disabled = true;
      btn.innerText = 'ĐANG GỬI YÊU CẦU...';

      setTimeout(() => {
        alert(`ĐÃ GỬI YÊU CẦU ĐẶT XE!\nKhách hàng: ${name}\nQuãng đường: ${measuredDistanceKm}km\nBác tài sẽ gọi lại cho bạn ngay theo số ${phone}!`);
        btn.disabled = false;
        btn.innerText = 'GỬI YÊU CẦU ĐẶT XE';
      }, 500);
    });

    calculateDistance();

    // LIVE PING
    const pingDot = document.getElementById('pingDot');
    const pingText = document.getElementById('pingText');

    async function updateRealPing() {
      if (!navigator.onLine) {
        pingDot.style.backgroundColor = '#ef4444';
        pingText.innerText = 'MẤT KẾT NỐI';
        pingText.style.color = '#ef4444';
        return;
      }

      const t0 = performance.now();
      try {
        await fetch('./manifest.json?t=' + Date.now(), { method: 'HEAD', cache: 'no-store' });
        const pingMs = Math.round(performance.now() - t0);
        pingDot.style.backgroundColor = pingMs < 150 ? '#10b981' : '#f59e0b';
        pingText.innerText = `${pingMs}ms • valpha-3.3`;
        pingText.style.color = '#dfb76c';
      } catch (err) {
        pingDot.style.backgroundColor = '#10b981';
        pingText.innerText = `ONLINE • valpha-3.3`;
      }
    }

    updateRealPing();
    setInterval(updateRealPing, 6000);
  </script>
</body>
</html>
