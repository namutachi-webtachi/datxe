<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Taxi TN - Đặt Xe Trực Tuyến</title>

  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0b1420">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="./assets/logo.png">

  <!-- LEAFLET BAN DO CDN -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="./css/booking.css?v=1.3.1">

  <!-- CLOUDFLARE TURNSTILE CAPTCHA -->
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>

  <div class="app-shell">
    
    <!-- HEADER -->
    <header class="top-nav">
      <img src="./assets/logo.png" alt="TN" class="nav-logo" id="secretLogo" title="Chạm 5 lần để làm mới hệ thống">
      <button type="button" class="nav-install-btn" id="pwaInstallBtn">
        <img src="./assets/download.png" alt="Tải App" class="install-icon-img" id="installIcon">
        <span class="install-text" id="installText">TẢI APP</span>
      </button>
    </header>

    <!-- MAIN CONTENT -->
    <main class="booking-content-area">
      
      <!-- KHU VUC BAN DO -->
      <section class="map-wrapper">
        <div id="map"></div>
        <button type="button" class="btn-gps-locate" id="btnGps">
          <svg class="gps-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
          </svg>
          VỊ TRÍ CỦA TÔI
        </button>
      </section>

      <!-- FORM NHAP THONG TIN -->
      <form id="bookingForm" class="booking-fields-form">
        
        <!-- DIEM DON -->
        <div class="field-group">
          <label for="pickupAddress">ĐIỂM ĐÓN</label>
          <input type="text" id="pickupAddress" autocomplete="off" required placeholder="Đang xác định vị trí của bạn...">
        </div>

        <!-- DIEM DEN TU DO -->
        <div class="field-group">
          <label for="dropoffAddress">ĐIỂM ĐẾN</label>
          <input type="text" id="dropoffAddress" autocomplete="off" required placeholder="Nhập điểm đến (kể cả tên ngõ, xóm, cổng làng...)">
        </div>

        <!-- LOAI CHUYEN -->
        <div class="trip-options-row">
          <label class="radio-chip">
            <input type="radio" name="tripType" value="oneway" checked>
            <span>MỘT CHIỀU</span>
          </label>
          <label class="radio-chip">
            <input type="radio" name="tripType" value="roundtrip">
            <span>KHỨ HỒI</span>
          </label>
        </div>

        <!-- THONG SO LO TRINH -->
        <div class="route-metrics-card">
          <div class="metric-item">
            <span class="metric-label">Quãng đường ước tính:</span>
            <strong class="metric-val" id="displayDistance">Bác tài báo trực tiếp</strong>
          </div>
          <div class="metric-item">
            <span class="metric-label">Thời gian dự kiến:</span>
            <strong class="metric-val" id="displayDuration">-- phút</strong>
          </div>
          <div class="metric-hint" id="metricHint">
            Quý khách có thể nhập địa chỉ bất kỳ. Bác tài sẽ liên hệ trực tiếp để xác nhận giờ đón và báo giá cước chuẩn nhất.
          </div>
        </div>

        <!-- THONG TIN KHACH -->
        <div class="field-group">
          <label for="customerName">HỌ VÀ TÊN</label>
          <input type="text" id="customerName" required placeholder="Nhập tên của bạn">
        </div>

        <div class="field-group">
          <label for="phoneNumber">SỐ ĐIỆN THOẠI</label>
          <input type="tel" id="phoneNumber" required placeholder="09xxxxxxxx (10 số)">
        </div>

        <div class="field-group">
          <label for="notes">GHI CHÚ THÊM (NẾU CÓ)</label>
          <input type="text" id="notes" placeholder="Ví dụ: Đón lúc 6h sáng, có 2 vali to...">
        </div>

        <!-- CAPTCHA VO HINH, TU DONG THONG QUA -->
        <div class="cf-turnstile" 
             data-sitekey="1x00000000000000000000BB" 
             data-callback="onCaptchaVerified"
             style="display: none;"></div>

        <!-- NUT SUBMIT -->
        <button type="submit" class="btn-submit-booking" id="btnSubmit">
          GỬI YÊU CẦU ĐẶT XE
        </button>

        <div class="contact-actions-row">
          <a href="https://zalo.me/0912101580" id="btnZaloDirect" class="btn-action-zalo" target="_blank">
            CHAT TRỰC TIẾP QUA ZALO
          </a>
          <a href="tel:0912101580" class="btn-action-hotline">
            HOTLINE: 0912.101.580
          </a>
        </div>

      </form>
    </main>

  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    window.isCaptchaPassed = true;
    function onCaptchaVerified(token) {
      window.isCaptchaPassed = true;
    }
  </script>

  <script type="module">
    // 1. TÍCH HỢP SYSTEM MONITOR TỰ ĐỘNG TỪ REPO
    try {
      const monitorModule = await import('./js/system-monitor.js');
      if (monitorModule.initSystemMonitor) {
        monitorModule.initSystemMonitor();
      }
    } catch (e) {
      console.warn('[Monitor] Chua khoi tao duoc system-monitor:', e);
    }

    // 2. TÍCH HỢP CÁC MODULE KHÁC
    let autoCropImage, initAppUpdater, initAddressAutocomplete;
    try {
      const cropModule = await import('./js/autocrop.js');
      autoCropImage = cropModule.autoCropImage;
    } catch (e) {}

    try {
      const updaterModule = await import('./js/app-updater.js');
      initAppUpdater = updaterModule.initAppUpdater;
      if (initAppUpdater) initAppUpdater();
    } catch (e) {}

    try {
      const geoModule = await import('./js/geo-search.js');
      initAddressAutocomplete = geoModule.initAddressAutocomplete;
    } catch (e) {}

    const installIcon = document.getElementById('installIcon');
    if (installIcon && autoCropImage) {
      try { autoCropImage(installIcon); } catch (e) {}
    }

    const installBtn = document.getElementById('pwaInstallBtn');
    let deferredPrompt = null;
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
    if (isStandalone && installBtn) installBtn.style.display = 'none';

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
    });

    if (installBtn) {
      installBtn.addEventListener('click', (e) => {
        e.preventDefault();
        if (navigator.vibrate) navigator.vibrate(30);

        if (deferredPrompt) {
          deferredPrompt.prompt();
          deferredPrompt.userChoice.then((choice) => {
            if (choice.outcome === 'accepted') installBtn.style.display = 'none';
            deferredPrompt = null;
          }).catch(() => {
            window.location.href = './guide.html';
          });
        } else {
          window.location.href = './guide.html';
        }
      });
    }

    const logoBtn = document.getElementById('secretLogo');
    if (logoBtn) {
      let tapCount = 0;
      let tapTimer = null;
      logoBtn.addEventListener('click', () => {
        tapCount++;
        clearTimeout(tapTimer);
        tapTimer = setTimeout(() => { tapCount = 0; }, 1500);

        if (tapCount >= 5) {
          if (navigator.vibrate) navigator.vibrate([80, 50, 80]);
          localStorage.clear();
          sessionStorage.clear();
          if ('caches' in window) {
            caches.keys().then((names) => {
              names.forEach((name) => caches.delete(name));
            });
          }
          alert('HỆ THỐNG: Đã làm mới sạch sẽ bộ nhớ cache!');
          window.location.replace('./booking.html?reset=1');
        }
      });
    }

    // ==========================================================================
    // CẤU HÌNH BẢN ĐỒ VÀ ĐỊA CHỈ
    // ==========================================================================
    const DEFAULT_COORDS = { lat: 20.4288, lon: 106.1685 }; // Nam Định
    let pickupCoords = { ...DEFAULT_COORDS };
    let dropoffCoords = null; 
    
    let routePolyline = null;
    let pickupMarker = null;
    let dropoffMarker = null;
    let userLocationMarker = null;
    let measuredDistanceKm = 0;

    const WORKER_URL = 'https://taxi-search-api.nnam14884.workers.dev';
    const BACKEND_API_URL = 'https://coretaxi.onrender.com/api/dispatch';

    const VN_BOUNDS = L.latLngBounds(
      L.latLng(8.179, 102.144),
      L.latLng(23.393, 109.464)
    );

    const map = L.map('map', { 
      zoomControl: false,
      scrollWheelZoom: false,
      fadeAnimation: false,
      markerZoomAnimation: false,
      bounceAtZoomLimits: false,
      maxBounds: VN_BOUNDS,
      maxBoundsViscosity: 1.0,
      minZoom: 5,
      maxZoom: 18,
      tap: true,
      renderer: L.canvas()
    }).setView([DEFAULT_COORDS.lat, DEFAULT_COORDS.lon], 13);
    
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 18,
      crossOrigin: true,
      attribution: 'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ'
    }).addTo(map);

    function forceResizeMap() {
      if (map) map.invalidateSize();
    }
    setTimeout(forceResizeMap, 100);
    setTimeout(forceResizeMap, 500);
    window.addEventListener('load', forceResizeMap);
    window.addEventListener('resize', forceResizeMap);
    window.addEventListener('orientationchange', forceResizeMap);

    pickupMarker = L.marker([pickupCoords.lat, pickupCoords.lon], { draggable: true }).addTo(map);

    pickupMarker.on('dragend', (e) => {
      const pos = e.target.getLatLng();
      pickupCoords = { lat: pos.lat, lon: pos.lng };
      document.getElementById('pickupAddress').value = 'Tọa độ đã ghim trên bản đồ';
      if (dropoffCoords) calculateDistance();
    });

    function setDropoffLocation(lat, lon) {
      dropoffCoords = { lat, lon };

      if (!dropoffMarker) {
        dropoffMarker = L.marker([lat, lon], { draggable: true }).addTo(map);
        dropoffMarker.on('dragend', (e) => {
          const pos = e.target.getLatLng();
          dropoffCoords = { lat: pos.lat, lon: pos.lng };
          document.getElementById('dropoffAddress').value = 'Tọa độ đã ghim trên bản đồ';
          calculateDistance();
        });
      } else {
        dropoffMarker.setLatLng([lat, lon]);
      }

      calculateDistance();
    }

    const userGpsIcon = L.divIcon({
      className: 'custom-gps-pin',
      html: `<div class="user-gps-pulse-marker" title="Vị trí của bạn"></div>`,
      iconSize: [18, 18],
      iconAnchor: [9, 9]
    });

    function locateUserGps(isAutoLoad = false) {
      if (!navigator.geolocation) {
        document.getElementById('pickupAddress').value = 'Vườn Cau Vị Khê, Nam Định';
        return;
      }

      navigator.geolocation.getCurrentPosition((pos) => {
        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;
        pickupCoords = { lat, lon };

        pickupMarker.setLatLng([lat, lon]);
        map.setView([lat, lon], 14);

        if (userLocationMarker) {
          userLocationMarker.setLatLng([lat, lon]);
        } else {
          userLocationMarker = L.marker([lat, lon], { icon: userGpsIcon }).addTo(map);
        }

        document.getElementById('pickupAddress').value = 'Vị trí hiện tại của bạn';

        if (dropoffCoords) {
          calculateDistance();
        }
      }, (err) => {
        if (!isAutoLoad) {
          alert('Không thể truy cập vị trí GPS. Vui lòng bật định vị trên thiết bị!');
        } else {
          document.getElementById('pickupAddress').value = 'Vườn Cau Vị Khê, Nam Định';
        }
      }, { enableHighAccuracy: true, timeout: 8000 });
    }

    locateUserGps(true);

    document.getElementById('btnGps').addEventListener('click', () => locateUserGps(false));

    function autoFitRouteBounds() {
      if (!dropoffCoords) return;

      const activePoints = [pickupMarker];
      if (dropoffMarker) activePoints.push(dropoffMarker);
      if (userLocationMarker) activePoints.push(userLocationMarker);

      if (routePolyline) {
        map.fitBounds(routePolyline.getBounds(), { padding: [35, 35], maxZoom: 16 });
      } else {
        const featureGroup = L.featureGroup(activePoints);
        map.fitBounds(featureGroup.getBounds(), { padding: [35, 35], maxZoom: 15 });
      }
    }

    async function calculateDistance() {
      if (!dropoffCoords || !pickupCoords) {
        document.getElementById('displayDistance').innerText = 'Bác tài báo trực tiếp';
        document.getElementById('displayDuration').innerText = '-- phút';
        if (routePolyline) map.removeLayer(routePolyline);
        return;
      }

      const url = `https://router.project-osrm.org/route/v1/driving/${pickupCoords.lon},${pickupCoords.lat};${dropoffCoords.lon},${dropoffCoords.lat}?overview=full&geometries=geojson`;
      
      try {
        const res = await fetch(url);
        const data = await res.json();
        
        if (data.routes && data.routes.length > 0) {
          const route = data.routes[0];
          measuredDistanceKm = Math.round((route.distance / 1000) * 10) / 10;
          const durationMins = Math.round(route.duration / 60);

          document.getElementById('displayDistance').innerText = `${measuredDistanceKm} km`;
          document.getElementById('displayDuration').innerText = `${durationMins} phút`;

          if (routePolyline) map.removeLayer(routePolyline);
          
          routePolyline = L.geoJSON(route.geometry, {
            renderer: L.canvas(),
            style: { color: '#dfb76c', weight: 5, opacity: 0.95 }
          }).addTo(map);

          autoFitRouteBounds();
        }
      } catch (err) {
        document.getElementById('displayDistance').innerText = 'Bác tài báo trực tiếp';
        document.getElementById('displayDuration').innerText = '-- phút';
      }
    }

    async function autoGeocodeAddressInput(addressText, isPickup = false) {
      if (!addressText || addressText.length < 2) return null;

      const lat = pickupCoords ? parseFloat(pickupCoords.lat).toFixed(4) : '20.4288';
      const lon = pickupCoords ? parseFloat(pickupCoords.lon).toFixed(4) : '106.1685';
      const url = `${WORKER_URL}/?q=${encodeURIComponent(addressText)}&lat=${lat}&lon=${lon}&limit=1`;

      try {
        const res = await fetch(url);
        if (res.ok) {
          const data = await res.json();
          if (data && data.features && data.features.length > 0) {
            const feature = data.features[0];
            const coords = feature.center; 

            if (isPickup) {
              pickupCoords = { lat: coords[1], lon: coords[0] };
              pickupMarker.setLatLng([coords[1], coords[0]]);
            } else {
              setDropoffLocation(coords[1], coords[0]);
            }
            return coords;
          }
        }
      } catch (e) {}

      if (!isPickup) {
        dropoffCoords = null;
        if (dropoffMarker) {
          map.removeLayer(dropoffMarker);
          dropoffMarker = null;
        }
        if (routePolyline) {
          map.removeLayer(routePolyline);
          routePolyline = null;
        }
        document.getElementById('displayDistance').innerText = 'Bác tài báo trực tiếp';
        document.getElementById('displayDuration').innerText = '-- phút';
      }
      return null;
    }

    document.getElementById('dropoffAddress').addEventListener('blur', async (e) => {
      const text = e.target.value.trim();
      if (text) {
        await autoGeocodeAddressInput(text, false);
      }
    });

    if (initAddressAutocomplete) {
      initAddressAutocomplete('pickupAddress', (selected) => {
        pickupCoords = { lat: selected.lat, lon: selected.lon };
        pickupMarker.setLatLng([selected.lat, selected.lon]);
        if (dropoffCoords) calculateDistance();
      }, () => pickupCoords);

      initAddressAutocomplete('dropoffAddress', (selected) => {
        setDropoffLocation(selected.lat, selected.lon);
      }, () => pickupCoords);
    }

    document.getElementById('customerName').value = localStorage.getItem('customerName') || '';
    document.getElementById('phoneNumber').value = localStorage.getItem('phoneNumber') || '';

    // ==========================================================================
    // XỬ LÝ SUBMIT: CHỈ GỬI VỀ RENDER ĐỂ BẮN BOT ZALO (KHÔNG NHẢY SANG ZALO NỮA)
    // ==========================================================================
    document.getElementById('bookingForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const name = document.getElementById('customerName').value.trim();
      const phone = document.getElementById('phoneNumber').value.trim();
      const pAddr = document.getElementById('pickupAddress').value.trim();
      const dAddr = document.getElementById('dropoffAddress').value.trim();
      const tripType = document.querySelector('input[name="tripType"]:checked')?.value === 'roundtrip' ? 'Khứ hồi' : 'Một chiều';
      const notes = document.getElementById('notes').value.trim();

      localStorage.setItem('customerName', name);
      localStorage.setItem('phoneNumber', phone);

      const btn = document.getElementById('btnSubmit');
      btn.disabled = true;
      btn.innerText = 'ĐANG GỬI VỀ TỔNG ĐÀI...';

      if (!dropoffCoords && dAddr) {
        await autoGeocodeAddressInput(dAddr, false);
      }

      const distanceInfo = (dropoffCoords && measuredDistanceKm > 0) ? `~${measuredDistanceKm} km` : 'Bác tài báo';

      const bookingPayload = {
        customerName: name,
        phoneNumber: phone,
        pickupAddress: pAddr,
        dropoffAddress: dAddr,
        tripType: tripType,
        distance: distanceInfo,
        notes: notes,
        pickupLat: pickupCoords?.lat,
        pickupLon: pickupCoords?.lon
      };

      try {
        // GỬI REQUEST VÀ ĐỢI RENDER PHẢN HỒI
        const res = await fetch(BACKEND_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(bookingPayload)
        });

        if (res.ok) {
          alert('✅ ĐẶT XE THÀNH CÔNG!\nBác tài đã nhận được lộ trình và sẽ liên hệ ngay cho bạn!');
          document.getElementById('bookingForm').reset();
          document.getElementById('displayDistance').innerText = 'Bác tài báo trực tiếp';
          document.getElementById('displayDuration').innerText = '-- phút';
        } else {
          alert('⚠️ Hệ thống đang bận. Bạn vui lòng liên hệ trực tiếp Hotline: 0912.101.580');
        }
      } catch (err) {
        console.error('[Render API] Loi ket noi:', err);
        alert('⚠️ Lỗi kết nối máy chủ. Bạn vui lòng liên hệ trực tiếp Hotline: 0912.101.580');
      } finally {
        btn.disabled = false;
        btn.innerText = 'GỬI YÊU CẦU ĐẶT XE';
      }
    });
  </script>
</body>
</html>
