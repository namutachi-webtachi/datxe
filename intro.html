<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Thanh Nguyen - Dich Vu Xe Rieng Chuyen Nghiep</title>
  <link rel="stylesheet" href="./css/scale.css">
  <style>
    /* ==========================================================================
       MODULE INTRO - CAN CHINH CHUAN 100% THEO BAN VE MAU
       Khong emoji - 3 mau: Den Navy #0b1420, Vang Kim #dfb76c, Do VF5 #dc2626
       ========================================================================== */

    body {
      background-color: #060b11;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100dvh;
      overflow: hidden;
    }

    .intro-viewport {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* Khung the danh thiep chuan mau xanh den theo anh mau */
    .card-front-module {
      width: var(--card-w);
      height: var(--card-h);
      background-color: #0b1420;
      border-radius: var(--radius-card);
      border: 1.5px solid rgba(223, 183, 108, 0.45);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 30px rgba(223, 183, 108, 0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: calc(var(--csu) * 4.5) calc(var(--csu) * 5) calc(var(--csu) * 3);
      position: relative;
      overflow: hidden;
      will-change: transform, opacity;
    }

    /* Hieu ung vet anh kim chay vat qua mat the */
    .card-front-module::after {
      content: "";
      position: absolute;
      top: 0;
      left: -150%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(247, 224, 163, 0.12), transparent);
      transform: skewX(-25deg);
      animation: sweepShine 5s infinite;
      pointer-events: none;
    }

    @keyframes sweepShine {
      0%, 75% { left: -150%; }
      100% { left: 150%; }
    }

    /* KHOI HEADER: LOGO TN VA CHU THANH NGUYEN KHOA CHAT CANH NHAU */
    .brand-lockup-row {
      width: 100%;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: calc(var(--csu) * 2.5);
      margin-bottom: calc(var(--csu) * 2);
      z-index: 2;
    }

    /* Logo TN dat ben trai, chieu cao khop voi khoi chu */
    .brand-logo-img {
      height: calc(var(--csu) * 19);
      width: auto;
      object-fit: contain;
      flex-shrink: 0;
      filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.8));
    }

    /* Khoi chu THANH NGUYEN dat ben phai Logo */
    .brand-text-img {
      width: calc(var(--csu) * 66);
      height: auto;
      max-height: calc(var(--csu) * 21);
      object-fit: contain;
      flex-shrink: 0;
      filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.8));
    }

    /* KHOI CON XE VF5: CAN GIUA HOAN TOAN O NUA DUOI, KHONG BI CAT CHIM */
    .car-trigger-container {
      width: 100%;
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      z-index: 3;
      transform-origin: center center;
      will-change: transform, filter, opacity;
      transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .car-trigger-container:active {
      transform: scale(0.96);
    }

    .vf5-real-img {
      width: calc(var(--csu) * 44);
      max-width: 190px;
      height: auto;
      object-fit: contain;
      display: block;
      margin: 0 auto;
      filter: drop-shadow(0 4px 15px rgba(0, 0, 0, 0.9));
    }

    /* ANIMATION CHINH: XE PHONG THANG RA MAN HINH */
    .car-launching-forward {
      animation: zoomCarToScreen 0.85s cubic-bezier(0.7, 0, 0.84, 0) forwards;
      pointer-events: none;
    }

    .card-fade-out-anim {
      animation: dissolveCardAnim 0.85s ease forwards;
    }

    @keyframes zoomCarToScreen {
      0% {
        transform: scale(1) translateZ(0);
        filter: drop-shadow(0 0 0 rgba(223, 183, 108, 0));
        opacity: 1;
      }
      30% {
        transform: scale(1.15) translateY(-5px);
        filter: drop-shadow(0 0 25px #f7e0a3) drop-shadow(0 15px 35px rgba(220, 38, 38, 0.6));
      }
      100% {
        transform: scale(18) translateY(120px) translateZ(1000px);
        filter: blur(16px) drop-shadow(0 0 70px #dc2626);
        opacity: 0;
      }
    }

    @keyframes dissolveCardAnim {
      0% {
        transform: scale(1);
        opacity: 1;
      }
      40% {
        transform: scale(1.02);
        opacity: 0.85;
      }
      100% {
        transform: scale(0.9);
        opacity: 0;
        filter: blur(10px);
      }
    }
  </style>
</head>
<body>

  <div class="app-shell">
    <div class="intro-viewport">
      <div class="card-perspective-box">
        <div class="card-front-module" id="cardModule">
          
          <!-- KHOI HEADER: LOGO TN + CHU THUONG HIEU KHOA KHE CHUAN ANH 2 -->
          <div class="brand-lockup-row">
            <img src="./assets/logo.png" alt="TN Logo" class="brand-logo-img">
            <img src="./assets/brand.png" alt="Thanh Nguyen" class="brand-text-img">
          </div>

          <!-- KHOI CON XE VF5 CAN GIUA TU NHIEN (BAM VAO DE LAO RA MAN HINH) -->
          <div class="car-trigger-container" id="carTrigger" title="Cham vao xe de khoi hanh">
            <img src="./assets/car.png" alt="VinFast VF5" class="vf5-real-img">
          </div>

        </div>
      </div>
    </div>
  </div>

  <script>
    const CACHE_KEY = 'thanh_nguyen_intro_seen';
    const carTrigger = document.getElementById('carTrigger');
    const cardModule = document.getElementById('cardModule');

    carTrigger.addEventListener('click', () => {
      carTrigger.classList.add('car-launching-forward');
      cardModule.classList.add('card-fade-out-anim');

      localStorage.setItem(CACHE_KEY, 'true');

      setTimeout(() => {
        window.location.href = './booking.html';
      }, 750);
    });
  </script>
</body>
</html>
