<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Thanh Nguyen - Dich Vu Xe Rieng Chuyen Nghiep</title>
  <link rel="stylesheet" href="./css/scale.css">
  <style>
    /* ==========================================================================
       MODULE INTRO SANH CHIEU - XANH DEN DEEP LUXURY NAVY & ANH THAT 100%
       ========================================================================== */

    body {
      background-color: #070d14;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100dvh;
      overflow: hidden;
    }

    .intro-viewport {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* Khung danh thiep: Nen Xanh Den Sang Trong theo dung ban goc cua Chu Tich */
    .card-front-module {
      width: var(--card-w);
      height: var(--card-h);
      background: radial-gradient(circle at 50% 35%, #0f1f33 0%, #07101b 100%);
      border-radius: var(--radius-card);
      border: 1px solid rgba(223, 183, 108, 0.4);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85), 0 0 35px rgba(223, 183, 108, 0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: calc(var(--csu) * 4.5) calc(var(--csu) * 4);
      position: relative;
      overflow: hidden;
      will-change: transform, opacity;
      transition: box-shadow 0.3s ease;
    }

    /* Vet sang kim loai chay luot qua mat the */
    .card-front-module::after {
      content: "";
      position: absolute;
      top: 0;
      left: -150%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(247, 224, 163, 0.12), transparent);
      transform: skewX(-25deg);
      animation: sweepShine 5s infinite;
      pointer-events: none;
    }

    @keyframes sweepShine {
      0%, 75% { left: -150%; }
      100% { left: 150%; }
    }

    /* Cum Header tren the: Logo TN va Chu Thuong Hieu */
    .brand-header-wrapper {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: calc(var(--csu) * 3);
      z-index: 2;
    }

    .brand-logo-img {
      width: calc(var(--csu) * 16);
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.7));
    }

    .brand-text-img {
      width: calc(var(--csu) * 70);
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.7));
    }

    /* ==========================================================================
       KHUNG CON XE VF5 THAT & HIỆU ỨNG LAO THẲNG VÀO MẮT NGƯỜI XEM
       ========================================================================== */

    .car-trigger-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      z-index: 3;
      transform-origin: center center;
      will-change: transform, filter, opacity;
      transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .car-trigger-container:active {
      transform: scale(0.96);
    }

    .vf5-real-img {
      width: calc(var(--csu) * 48);
      height: auto;
      max-height: calc(var(--csu) * 45);
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 6px 15px rgba(0, 0, 0, 0.8));
    }

    /* Chu huong dan nhe nhang o duoi */
    .tap-hint-text {
      font-size: calc(var(--csu) * 2.2);
      color: var(--text-muted, #94a3b8);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-top: calc(var(--csu) * 1);
      animation: pulseHint 2.5s infinite;
      z-index: 2;
    }

    @keyframes pulseHint {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 0.95; color: #f7e0a3; }
    }

    /* ANIMATION CHINH: XE PHONG THANG VE PHIA MAN HINH (DRIVE TOWARDS CAMERA) */
    .car-launching-forward {
      animation: zoomCarToScreen 0.85s cubic-bezier(0.7, 0, 0.84, 0) forwards;
      pointer-events: none;
    }

    .card-fade-out-anim {
      animation: dissolveCardAnim 0.85s ease forwards;
    }

    @keyframes zoomCarToScreen {
      0% {
        transform: scale(1) translateZ(0);
        filter: drop-shadow(0 0 0 rgba(223, 183, 108, 0));
        opacity: 1;
      }
      30% {
        transform: scale(1.15) translateY(-5px);
        filter: drop-shadow(0 0 25px #f7e0a3) drop-shadow(0 15px 35px rgba(220, 38, 38, 0.5));
      }
      100% {
        /* Phong to gap 18 lan va lao thang vao mat nguoi xem */
        transform: scale(18) translateY(120px) translateZ(1000px);
        filter: blur(16px) drop-shadow(0 0 70px #dc2626);
        opacity: 0;
      }
    }

    @keyframes dissolveCardAnim {
      0% {
        transform: scale(1);
        opacity: 1;
      }
      40% {
        transform: scale(1.02);
        opacity: 0.85;
      }
      100% {
        transform: scale(0.9);
        opacity: 0;
        filter: blur(10px);
      }
    }
  </style>
</head>
<body>

  <div class="app-shell">
    <div class="intro-viewport">
      <div class="card-perspective-box">
        <div class="card-front-module" id="cardModule">
          
          <!-- CUM HEADER ANH: LOGO TN VA CHU THUONG HIEU -->
          <div class="brand-header-wrapper">
            <img src="./assets/logo.png" alt="TN Logo" class="brand-logo-img">
            <img src="./assets/brand.png" alt="Thanh Nguyen" class="brand-text-img">
          </div>

          <!-- ANH CON XE VF5 THAT (NUT BAM KHOI HANH LAO THANG RA MAN HINH) -->
          <div class="car-trigger-container" id="carTrigger" title="Cham vao xe de khoi hanh">
            <img src="./assets/car.png" alt="VinFast VF5" class="vf5-real-img">
          </div>

          <!-- HUONG DAN -->
          <div class="tap-hint-text">CHAM VAO XE DE KHOI HANH</div>

        </div>
      </div>
    </div>
  </div>

  <script>
    const CACHE_KEY = 'thanh_nguyen_intro_seen';
    const carTrigger = document.getElementById('carTrigger');
    const cardModule = document.getElementById('cardModule');

    // KHI BAM VAO CON XE VF5
    carTrigger.addEventListener('click', () => {
      carTrigger.classList.add('car-launching-forward');
      cardModule.classList.add('card-fade-out-anim');

      // Ghi nho cache khach da xem
      localStorage.setItem(CACHE_KEY, 'true');

      // Sau 0.8s xe lao het hanh trinh thi nhay sang trang dat xe
      setTimeout(() => {
        window.location.href = './booking.html';
      }, 750);
    });
  </script>
</body>
</html>
