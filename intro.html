<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Thanh Nguyen - Dich Vu Xe Rieng Chuyen Nghiep</title>
  <link rel="stylesheet" href="./css/intro.css">
</head>
<body>

  <div class="viewport-box">
    <div class="card-master" id="cardBox">
      
      <div class="header-group">
        <img src="./assets/logo.png" alt="TN Monogram" class="logo-item" id="imgLogo">
        <img src="./assets/brand.png" alt="Thanh Nguyen" class="brand-item" id="imgBrand">
      </div>

      <div class="car-zone" id="carZone" title="Cham vao xe de khoi hanh">
        <img src="./assets/car.png" alt="VinFast VF5" class="car-image" id="imgCar">
        <div class="under-shadow"></div>
      </div>

    </div>

    <div class="action-badge" id="actionBadge">
      <div class="pulsing-dot"></div>
      <span class="badge-text">CHẠM VÀO XE ĐỂ KHỞI HÀNH</span>
    </div>
  </div>

  <script type="module">
    import { autoCropImage } from './js/autocrop.js';

    const CACHE_KEY = 'thanh_nguyen_intro_seen';
    if (localStorage.getItem(CACHE_KEY) === 'true') {
      window.location.replace('./booking.html');
    }

    window.addEventListener('DOMContentLoaded', async () => {
      const imgLogo = document.getElementById('imgLogo');
      const imgBrand = document.getElementById('imgBrand');
      const imgCar = document.getElementById('imgCar');
      const cardBox = document.getElementById('cardBox');
      const actionBadge = document.getElementById('actionBadge');

      await Promise.all([
        autoCropImage(imgLogo),
        autoCropImage(imgBrand),
        autoCropImage(imgCar)
      ]);

      cardBox.classList.add('ready');
      actionBadge.classList.add('ready');
    });

   const carZone = document.getElementById('carZone');
    const cardBox = document.getElementById('cardBox');
    const viewportBox = document.querySelector('.viewport-box');

    carZone.addEventListener('click', () => {
      if (navigator.vibrate) {
        navigator.vibrate([30, 40, 80]);
      }

      carZone.classList.add('launching');
      cardBox.classList.add('dissolving');
      viewportBox.classList.add('flashing');

      localStorage.setItem(CACHE_KEY, 'true');

      setTimeout(() => {
        window.location.href = './booking.html';
      }, 760);
    });
  </script>
</body>
</html>
